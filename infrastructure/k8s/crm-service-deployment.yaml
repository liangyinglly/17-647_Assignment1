apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: bookstore-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-service
  template:
    metadata:
      labels:
        app: crm-service
    spec:
      containers:
        - name: crm-service
          image: 502612814580.dkr.ecr.us-east-1.amazonaws.com/crm-service:latest
          imagePullPolicy: Always
          env:
            - name: ANDREW_ID
              value: "irish2"
            - name: KAFKA_BROKERS
              value: "98.88.99.206:9092,34.195.107.7:9092,54.221.160.63:9092"
            - name: KAFKA_TOPIC
              value: "irish2.customer.evt"
            - name: KAFKA_CLIENT_ID
              value: "crm-service"
            - name: KAFKA_GROUP_ID
              value: "crm-service-group"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_PASS
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: EMAIL_FROM
